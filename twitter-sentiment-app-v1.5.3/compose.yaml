services:
  web:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env.v2
    environment:
      TRADERSECHO_DB: /app/data/tradersecho.sqlite
    volumes: ["tradersecho-data:/app/data"]
    restart: unless-stopped
  collector:
    build: .
    profiles: ["live"]
    command: ["python", "-m", "backend.run_local", "--loop"]
    env_file: .env.v2
    environment:
      TRADERSECHO_DB: /app/data/tradersecho.sqlite
    volumes: ["tradersecho-data:/app/data"]
    restart: unless-stopped
volumes:
  tradersecho-data:
